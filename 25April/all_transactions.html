<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Transactions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-white min-h-screen font-sans">
  <!-- Container -->
  <div class="max-w-6xl mx-auto py-10 px-4">
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-500">
        All Transactions
      </h1>
      <p class="text-gray-700 text-lg mt-1">A detailed view of all recent transactions</p>
    </div>

    <!-- Transactions Table -->
    <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-gray-200">
      <table class="w-full text-sm text-left text-gray-700">
        <thead class="bg-indigo-100 text-indigo-800 font-semibold">
          <tr>
            <th class="px-6 py-3">Date</th>
            <th class="px-6 py-3">Amount</th>
            <th class="px-6 py-3">To/From</th>
            <th class="px-6 py-3">Status</th>
          </tr>
        </thead>
        <tbody>
          {% for txn in transactions %}
          <tr class="border-b hover:bg-indigo-50">
            <td class="px-6 py-3">{{ txn.date|date:"m/d/Y" }}</td>
            <td class="px-6 py-3">${{ txn.amount|floatformat:2 }}</td>
            <td class="px-6 py-3">{{ txn.description }}</td>
            <td class="px-6 py-3">
              <span class="{% if txn.status == 'Success' %}text-green-600{% elif txn.status == 'Pending' %}text-yellow-500{% else %}text-red-500{% endif %}">
                {{ txn.status }}
              </span>
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="4" class="text-center py-6 text-gray-500">No transactions available.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <!-- Back Button -->
    <div class="mt-6 text-right">
      <a href="{% url 'dashboard' %}"
         class="inline-block bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-semibold px-5 py-2 rounded-xl shadow-md hover:scale-105 transform transition-all duration-200">
        ⬅ Back to Dashboard
      </a>
    </div>
  </div>
</body>
</html>
