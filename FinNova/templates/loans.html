        <script>
            document.getElementById('loanForm').addEventListener('submit', async function (e) {
                e.preventDefault();

                const loanAmount = parseFloat(document.getElementById('loanAmount').value);
                const assetValue = parseFloat(document.getElementById('assets').value);
                const income = document.getElementById('incomeBracket').value;
                const resultDiv = document.getElementById('resultMessage');
                // -------------------------
                console.log({ loanAmount, assetValue, income });
                if (isNaN(loanAmount) || loanAmount <= 0) {
                    resultDiv.textContent = 'Please enter a valid loan amount.';
                    resultDiv.style.color = 'red';
                    return;
                }
                if (isNaN(assetValue) || assetValue <= 0) {
                    resultDiv.textContent = 'Please enter a valid asset value.';
                    resultDiv.style.color = 'red';
                    return;
                }
                if (!income) {
                    resultDiv.textContent = 'Please select an income bracket.';
                    resultDiv.style.color = 'red';
                    return;
                }
                // ----------------------------

                if (loanAmount > assetValue) {
                    resultDiv.textContent = 'Loan request denied: Loan amount exceeds asset value.';
                    resultDiv.style.color = 'red';
                    return;
                }

                if (income === 'low' && loanAmount > 1000000) {
                    resultDiv.textContent = 'Loan request denied: Exceeds income bracket limit.';
                    resultDiv.style.color = 'red';
                    return;
                }

                if (income === 'medium' && loanAmount > 5000000) {
                    resultDiv.textContent = 'Loan request denied: Exceeds income bracket limit.';
                    resultDiv.style.color = 'red';
                    return;
                }

                //Backend! Modify acc. to others naming convention
                //################################################

                // try{
                const response = await fetch('http://localhost:5000/api/loan-request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ loanAmount, assetValue, income })
                });

                const result = await response.json();
                resultDiv.textContent = result.message;
                resultDiv.style.color = result.success ? 'green' : 'red';
            });
            // } catch(error) {
            //     resultDiv.textContent = 'Error submitting loan request.';
            //     resultDiv.style.color = 'red';
            //     return;
            // });
        </script>
