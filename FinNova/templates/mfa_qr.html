{%extends 'layout.html'%}
{%load static%}
{%block title%}
    FinNova | Login
{%endblock%}

{%block content%}
 
    <div class="flex flex-col items-center justify-center px-6 py-8 mx-50 md:h-screen lg:py-0">
     
        <div class="w-full bg-white rounded-lg shadow-2xl md:mt-0 sm:max-w-md xl:p-0">
            {% if error %}
                <p style="color:red; margin: 20px;">{{ error }}</p>
            {% endif %}
            <form class="space-y-4 md:space-y-6" method="post" action="{%url 'myApp:verify_gcode'%}">
                {% csrf_token %}
                <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
                <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl text-center ">
                    Scan this QR Code with Your Authenticator App
                </h1>

                <img src="data:image/png;base64,{{ qr_img }}" alt="QR Code">
                <input type="text" name="gcode" id="google_auth_code" placeholder="Enter 6-digit code here" class="bg-gray-50 border border-gray-500 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" required="">
                <button type="submit" class="w-full text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center cursor-pointer">Verify code</button>
                </div>
            </form>
           
          
        </div>
    </div>

{%endblock%}
